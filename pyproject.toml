[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfobro"
version = "0.1.0"
description = "BFO compliance checker for OWL ontologies"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0.0",
    "rich>=13.0.0",
]

[project.scripts]
bfobro = "bfobro.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bfobro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
